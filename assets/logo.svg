<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="scout-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="scout-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="scout-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="32" fill="url(#scout-bg)" />
  <rect x="2" y="2" width="124" height="124" rx="30" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <!-- Ambient Radar Glow -->
  <circle cx="64" cy="64" r="44" fill="url(#scout-glow)" />

  <!-- Outer Concentric Radar Ring (Dashed) -->
  <circle cx="64" cy="64" r="44" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 4" stroke-opacity="0.7" />

  <!-- Mid Concentric Radar Ring -->
  <circle cx="64" cy="64" r="30" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />

  <!-- Inner Concentric Ring -->
  <circle cx="64" cy="64" r="16" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Radar Crosshairs -->
  <line x1="64" y1="14" x2="64" y2="34" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="64" y1="94" x2="64" y2="114" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="14" y1="64" x2="34" y2="64" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="94" y1="64" x2="114" y2="64" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Radar Sweep Cone -->
  <path d="M64 64 L95 33 A 44 44 0 0 0 64 20 Z" fill="url(#scout-glow)" opacity="0.8" />

  <!-- Central Target Beacon Core -->
  <circle cx="64" cy="64" r="9" fill="url(#scout-accent)" />
  <circle cx="64" cy="64" r="4" fill="#ffffff" />

  <!-- Blip Signals -->
  <circle cx="90" cy="46" r="3.5" fill="#10b981" />
  <circle cx="42" cy="78" r="2.5" fill="#38bdf8" />
</svg>
